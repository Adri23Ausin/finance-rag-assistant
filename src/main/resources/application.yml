spring:
  application:
    name: finance-rag-assistant
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/financerag
    username: ${DB_USERNAME:financerag}
    password: ${DB_PASSWORD:financerag}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  mvc:
    async:
      # Streamed answers from a local model on CPU can take a while (Tomcat's default is 30s)
      request-timeout: 5m
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # Download the models on first start (llama3.2 is about 2 GB)
        pull-model-strategy: ${OLLAMA_PULL_MODEL_STRATEGY:when_missing}
        timeout: 20m
      chat:
        model: ${CHAT_MODEL:llama3.2}
        temperature: 0.1
        # Ollama's default context window (2048 tokens) silently cuts off the sources
        num-ctx: 8192
      embedding:
        model: ${EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        # The table is created by Flyway (V1__create_vector_store.sql)
        initialize-schema: false
        dimensions: 768
        distance-type: cosine_distance
        index-type: hnsw
    chat:
      memory:
        repository:
          jdbc:
            # The table is created by Flyway (V3__create_chat_memory.sql)
            initialize-schema: never

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

rag:
  ingestion:
    chunk-size: 350
    # Documents indexed at the same time (embedding is CPU/GPU bound on the model server)
    max-concurrent-indexing: 2
  retrieval:
    top-k: 5
    # Cosine similarity a chunk needs to be used as a source; a starting point for
    # nomic-embed-text, worth tuning on your own documents
    similarity-threshold: 0.5
    # Messages of a conversation sent with each question
    history-size: 10
    # Rewrite follow-ups ("and in 2024?") into standalone questions before searching
    rewrite-follow-ups: true
