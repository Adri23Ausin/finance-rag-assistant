spring:
  application:
    name: finance-rag-assistant
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/financerag
    username: ${DB_USERNAME:financerag}
    password: ${DB_PASSWORD:financerag}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # Download the models on first start (llama3.2 is about 2 GB)
        pull-model-strategy: when_missing
        timeout: 20m
      chat:
        model: ${CHAT_MODEL:llama3.2}
        temperature: 0.1
      embedding:
        model: ${EMBEDDING_MODEL:nomic-embed-text}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
